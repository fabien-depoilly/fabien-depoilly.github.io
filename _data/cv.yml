cv:
  name: Fabien Depoilly
  label: PhD in Fluid Mechanics
  email: fabien.depoilly@gmail.com
  location: Villeurbanne, France
  image: ""
  summary: >
    My research focuses on the stability of thin-film flows of non-Newtonian fluids down an inclined
    plane, relevant to numerous natural and industrial contexts (avalanches, mudflows, coating
    processes, etc.). Given the diversity of rheological behaviours, my work aims to establish a
    unifying theoretical framework — independent of any specific rheological law — confronted with
    experimental data obtained on an inclined channel.

